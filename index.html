<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CVQuick</title>

  <style>
    body {
      margin: 0;
      background: #f3f6fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 760px;
      margin: 30px auto;
      padding: 18px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.1);
    }

    h1 {
      color: #155eef;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 20px 0 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 110px;
    }

    .progress {
      height: 8px;
      background: #e4e7ec;
      border-radius: 10px;
      margin: 24px 0;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: #155eef;
      border-radius: 10px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #155eef;
      color: white;
    }

    .secondary {
      background: #e8edf5;
      color: #172033;
    }

    button:disabled {
      opacity: .5;
    }

    .hidden {
      display: none;
    }

    .cv h2 {
      color: #123b7a;
      border-bottom: 2px solid #123b7a;
      padding-bottom: 5px;
      margin-top: 25px;
    }

    .contact {
      color: #555;
    }

    @media print {
      body {
        background: white;
      }

      .card {
        box-shadow: none;
      }

      .no-print {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <section id="formScreen">
        <h1>CVQuick</h1>
        <p>Answer simple questions and create a professional CV.</p>

        <div class="progress">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionArea"></div>

        <div class="actions">
          <button id="backButton" class="secondary" type="button">
            Back
          </button>

          <button id="nextButton" class="primary" type="button">
            Next
          </button>
        </div>
      </section>

      <section id="resultScreen" class="hidden">
        <div class="no-print">
          <h1>Your CV draft</h1>
          <button id="printButton" class="primary" type="button">
            Print / Save as PDF
          </button>

          <button id="restartButton" class="secondary" type="button">
            Start again
          </button>
        </div>

        <div id="cvOutput" class="cv"></div>
      </section>

    </div>
  </div>

  <script>
    const questions = [
      {
        key: "name",
        title: "About you",
        text: "What is your full name?",
        type: "input"
      },
      {
        key: "contact",
        title: "Contact details",
        text: "What phone number and professional email should employers use?",
        type: "input"
      },
      {
        key: "location",
        title: "Location",
        text: "Which city and country do you live in?",
        type: "input"
      },
      {
        key: "role",
        title: "Target job",
        text: "What job title are you applying for?",
        type: "input"
      },
      {
        key: "skills",
        title: "Your strengths",
        text: "What are you good at? Mention tasks, tools, software, subjects, or strengths.",
        type: "textarea"
      },
      {
        key: "experience",
        title: "Experience",
        text: "Tell us about work, informal work, volunteering, family-business work, freelance work, or projects.",
        type: "textarea"
      },
      {
        key: "achievement",
        title: "Proof of ability",
        text: "Describe one problem you solved or task you completed successfully.",
        type: "textarea"
      },
      {
        key: "education",
        title: "Education and training",
        text: "What did you study? Include courses, licences, apprenticeships, or training.",
        type: "textarea"
      },
      {
        key: "languages",
        title: "Languages",
        text: "Which languages can you use?",
        type: "input"
      }
    ];

    let current = 0;
    const answers = {};

    const questionArea = document.getElementById("questionArea");
    const progressBar = document.getElementById("progressBar");
    const nextButton = document.getElementById("nextButton");
    const backButton = document.getElementById("backButton");
    const formScreen = document.getElementById("formScreen");
    const resultScreen = document.getElementById("resultScreen");
    const cvOutput = document.getElementById("cvOutput");

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function (char) {
        const symbols = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          """: "&quot;",
          "'": "&#039;"
        };

        return symbols[char];
      });
    }

    function displayQuestion() {
      const question = questions[current];
      const savedAnswer = answers[question.key] || "";

      const field = question.type === "textarea"
        ? `<textarea id="answer">${escapeHtml(savedAnswer)}</textarea>`
        : `<input id="answer" value="${escapeHtml(savedAnswer)}">`;

      questionArea.innerHTML = `
        <h2>${question.title}</h2>
        <p>Question ${current + 1} of ${questions.length}</p>
        <label for="answer">${question.text}</label>
        ${field}
      `;

      progressBar.style.width =
        ((current + 1) / questions.length * 100) + "%";

      backButton.disabled = current === 0;

      nextButton.textContent =
        current === questions.length - 1
          ? "Create my CV"
          : "Next";
    }

    function saveAnswer() {
      const answer = document.getElementById("answer");

      if (answer) {
        answers[questions[current].key] = answer.value.trim();
      }
    }

    function nextQuestion() {
      saveAnswer();

      if (current < questions.length - 1) {
        current++;
        displayQuestion();
      } else {
        createCv();
      }
    }

    function previousQuestion() {
      saveAnswer();

      if (current > 0) {
        current--;
        displayQuestion();
      }
    }

    function makeBullets(text) {
      if (!text) {
        return "<li>No information added yet.</li>";
      }

      return text
        .split(/[.!?
]+/)
        .map(item => item.trim())
        .filter(item => item.length > 0)
        .map(item => `<li>${escapeHtml(item)}</li>`)
        .join("");
    }

    function createCv() {
      const name = answers.name || "Your Name";
      const contact = answers.contact || "Add phone and email";
      const location = answers.location || "";
      const role = answers.role || "professional opportunity";

      formScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      cvOutput.innerHTML = `
        <h1>${escapeHtml(name)}</h1>

        <div class="contact">
          ${escapeHtml(contact)}
          ${location ? " · " + escapeHtml(location) : ""}
        </div>

        <h2>Professional Summary</h2>
        <p>
          ${escapeHtml(answers.skills || "Motivated applicant seeking a " + role + " opportunity.")}
        </p>

        <h2>Core Skills</h2>
        <p>${escapeHtml(answers.skills || "Add your skills")}</p>

        <h2>Experience and Projects</h2>
        <ul>
          ${makeBullets(answers.experience)}
          ${makeBullets(answers.achievement)}
        </ul>

        <h2>Education and Training</h2>
        <p>${escapeHtml(answers.education || "Add your education and training")}</p>

        <h2>Languages</h2>
        <p>${escapeHtml(answers.languages || "Add your languages")}</p>
      `;
    }

    function restart() {
      location.reload();
    }

    nextButton.addEventListener("click", nextQuestion);
    backButton.addEventListener("click", previousQuestion);
    document.getElementById("printButton").addEventListener("click", function () {
      window.print();
    });
    document.getElementById("restartButton").addEventListener("click", restart);

    displayQuestion();
  </script>
</body>
</html>
